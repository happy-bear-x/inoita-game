# 新版本入口：https://catgo.online/
# 80 只做证书校验和跳转；443 反代到 127.0.0.1:4014（inoita-game-v2.service）。
# 旧版仍在 https://catgo.online:4002/，由 catgo.online.conf 提供。
server {
    listen 80;
    listen [::]:80;
    server_name catgo.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://catgo.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name catgo.online;

    ssl_certificate     /etc/letsencrypt/live/catgo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catgo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:STORY_TLS_V2:10m;
    ssl_session_timeout 1d;

    # 云存档 JSON 请求体；nginx 默认 1m 会在 Node 之前挡掉大存档。
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
