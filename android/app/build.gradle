import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'com.cefrium'
}

// 服务地址只在 config/endpoints.json 维护，Gradle、Java 和页面都不写域名。
def endpointsFile = new File(rootProject.projectDir, '../config/endpoints.json')
def endpoints = new JsonSlurper().parse(endpointsFile)
def releaseServerBaseUrl =
        endpoints.environments.androidRelease.serverBaseUrl.toString().replaceAll('/+$', '')
def updateChannel = (project.findProperty('updateChannel') ?: 'stable').toString()
// 公钥文件由 npm run update:key 生成；还没生成时留空，热更检查会自动跳过。
def updatePublicKeyFile = new File(rootProject.projectDir, 'update-public-key.txt')
def updatePublicKey = updatePublicKeyFile.exists()
        ? updatePublicKeyFile.getText('UTF-8').replaceAll('\\s+', '')
        : ''
// APK 自带的网页版本号；运行时优先读 APK 里的基线清单，读不到时用它兜底，
// 避免把自带完整网页的安装包误认成「纯 APK」而反复提示全量更新。
def baselinePointer = null
def baselinePointerFile = new File(rootProject.projectDir, '../dist/update/latest.json')
if (baselinePointerFile.exists()) {
    try {
        baselinePointer = new JsonSlurper().parse(baselinePointerFile)
    } catch (Exception ignored) {
        baselinePointer = null
    }
}
def baselineBuildId = baselinePointer?.buildId?.toString() ?: ''
def baselineBuiltAt = baselinePointer?.builtAt?.toString() ?: ''

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'io.github.sunflower9264.inoita'
    // Cefrium 0.18.0 内置 Chromium 156；编译与打包必须用 Android 37 平台。
    compileSdk 37

    defaultConfig {
        applicationId 'io.github.sunflower9264.inoita'
        // Cefrium 最低 Android 10。旧的 WebView 壳是 26，换引擎后不再支持 8/9。
        minSdk 29
        targetSdk 34
        versionCode 14
        versionName '2.0.1'
        buildConfigField 'String', 'BASELINE_BUILD_ID', "\"${baselineBuildId}\""
        buildConfigField 'String', 'BASELINE_BUILT_AT', "\"${baselineBuiltAt}\""
        ndk {
            // 只发 arm64；Cefrium 的 x86_64 构建只用于模拟器。
            abiFilters 'arm64-v8a'
        }
        // 诊断、云存档和热更都从同一个服务根地址派生；改服务器地址只改 config/endpoints.json。
        buildConfigField 'String', 'DIAGNOSTICS_URL',
                JsonOutput.toJson(releaseServerBaseUrl + '/__diagnostics/report')
        buildConfigField 'String', 'CLOUD_SAVE_URL',
                JsonOutput.toJson(releaseServerBaseUrl + '/__cloud')
        // 热更源：正式 latest.json，自测包（-PupdateChannel=staging）用 latest-staging.json。
        buildConfigField 'String', 'UPDATE_BASE_URL', JsonOutput.toJson(releaseServerBaseUrl)
        buildConfigField 'String', 'UPDATE_CHANNEL', JsonOutput.toJson(updateChannel)
        // 换引擎、换 JS 桥时加一；服务端用 minShell 拦住不兼容的旧壳。
        buildConfigField 'int', 'SHELL_VERSION', '2'
        buildConfigField 'String', 'UPDATE_PUBLIC_KEY', JsonOutput.toJson(updatePublicKey)
    }

    sourceSets {
        main {
            // 直接把 Vite 的 dist 当作 assets 根目录，避免每次复制 200MB。
            assets.srcDirs += new File(rootProject.projectDir, '../dist')
        }
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Chromium 的原生库必须解压到磁盘后再加载。
            useLegacyPackaging = true
        }
    }

    androidResources {
        // PNG 已经在资源管线外处理过，aapt2 不再重新压缩。
        cruncherEnabled = false
        // 点文件（例如 dist/.build-meta.json）不进 APK。
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // 把 Chromium 156 打进 APK，页面不再依赖设备自带的 WebView。
    implementation 'com.cefrium:cefrium-sdk:0.18.0'
    // 只在一次性存档迁移时用系统 WebView 读取旧地址的 localStorage。
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    // 本地资源服务：只监听 127.0.0.1，给页面送热更文件和原生端点。
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
